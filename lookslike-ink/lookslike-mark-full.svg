    <path d="M80.9 99 C80.7 104 80.1 108 80.1 112 C80.1 115 83.9 115 83.9 112 C83.9 108 83.3 104 83.1 99 Z"/>
  </g>
  <!-- left half: filled -->
  <path fill="currentColor" d="M60 104 C54 100 42 102 36 98 C34 92 38 88 46 86 C38 78 20 84 20 74 C20 64 30 62 40 62 C32 54 12 54 14 44 C18 34 36 36 46 42 C38 34 28 24 34 18 C42 14 48 20 54 26 C56 22 57 16 60 10 L60 104 Z"/>
