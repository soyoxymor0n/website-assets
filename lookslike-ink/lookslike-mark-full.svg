  <path fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" d="M60 10 C63 16 64 22 66 26 C72 20 78 14 86 18 C92 24 82 34 74 42 C84 36 102 34 106 44 C108 54 88 54 80 62 C90 62 100 64 100 74 C100 84 82 78 74 86 C82 88 86 92 84 98 C78 102 66 100 60 104"/>
