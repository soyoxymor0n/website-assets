  <g fill="currentColor">
    <ellipse cx="60" cy="141" rx="2.4" ry="3"/>
    <ellipse cx="72" cy="130" rx="1.5" ry="1.9"/>
    <ellipse cx="48" cy="130" rx="1.5" ry="1.9"/>
